[project]
name = "zakup-check"
version = "0.1.0"
description = "Проверка извещений о закупке на соответствие 44-ФЗ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
fas = [
    "pypdf>=4.0",
    "mammoth>=1.8",
]
retrieval = [
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
